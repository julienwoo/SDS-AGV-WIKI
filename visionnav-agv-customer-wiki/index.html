<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionNav AGV Customer Wiki</title>
<style>
:root{--navy:#10233f;--blue:#1769e0;--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#687386;--border:#e2e7ef;--red:#d83a3a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:64px;background:#fff;border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;position:sticky;top:0;z-index:10}.brand{font-weight:800;color:var(--navy);font-size:18px}
.layout{display:grid;grid-template-columns:275px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--border);padding:22px 15px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
nav a{display:block;text-decoration:none;color:#566174;padding:9px 11px;border-radius:8px;font-size:13px;margin:2px 0}nav a:hover{background:#eaf2ff;color:var(--blue)}nav .section{display:block;margin:18px 10px 7px;font-size:11px;color:#9aa3b2;font-weight:800}
main{max-width:1100px;width:100%;padding:38px 36px;margin:auto}.hero{background:linear-gradient(135deg,#10233f,#1d559e);color:#fff;border-radius:18px;padding:38px}.hero h1{margin:0 0 10px;font-size:30px}.hero p{color:#dbe8fb;line-height:1.6}.search{display:flex;gap:10px;margin-top:22px}.search input{flex:1;padding:14px 16px;border:0;border-radius:9px;font-size:15px}.search button{border:0;border-radius:9px;padding:0 20px;color:var(--blue);font-weight:800;cursor:pointer}
h2{margin:34px 0 14px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:19px;transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:0 6px 20px #10233f10}.card span{font-size:13px;color:var(--muted);line-height:1.55}.issue{cursor:pointer}.issue b{font-size:14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
#reader{display:none;background:#fff;border:1px solid var(--border);border-radius:16px;padding:32px;line-height:1.7}.back{color:var(--blue);font-weight:700;cursor:pointer;margin-bottom:18px}.meta{color:var(--muted);font-size:13px;margin-bottom:20px}.article h1{font-size:28px}.article h2{margin-top:30px}.article li{margin:5px 0}.article blockquote{border-left:4px solid var(--blue);margin:20px 0;padding:10px 16px;background:#f4f8ff}.no-results{padding:20px;background:#fff;border:1px solid var(--border);border-radius:12px;color:var(--muted)}
@media(max-width:800px){.layout{display:block}aside{display:none}main{padding:20px}.grid{grid-template-columns:1fr}.hero{padding:25px}.hero h1{font-size:24px}.search{flex-direction:column}.search button{height:44px}}
</style></head>
<body><header><div class="brand">VN VisionNav AGV · Customer Wiki</div></header>
<div class="layout"><aside><nav id="nav"></nav></aside><main>
<section id="home"><div class="hero"><h1>How can we help?</h1><p>Find AGV troubleshooting procedures, daily operation instructions and reference information.</p>
<div class="search"><input id="q" placeholder="Search: stopped, laser, charging, RCS..."><button onclick="search()">Search</button></div></div>
<div id="results"></div><div id="homeContent"></div></section>
<section id="reader"><div class="back" onclick="goHome()">← Back to Home</div><div class="article" id="doc"></div></section>
</main></div>
<script>
let articles=[];const base=location.pathname.endsWith('/')?location.pathname:location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);
async function init(){articles=await (await fetch(base+'content/articles.json')).json();renderNav();renderHome();const id=location.hash.slice(1);if(id)openById(id)}
function renderNav(){let h='<a href="#" onclick="goHome();return false">🏠 Home</a>';['Troubleshooting','Daily Operations','Reference'].forEach(g=>{h+=`<span class="section">${g.toUpperCase()}</span>`;articles.filter(a=>a.category===g).forEach(a=>h+=`<a href="#${a.id}" onclick="openById('${a.id}');return false">${a.icon} ${a.title}</a>`)});document.getElementById('nav').innerHTML=h}
function renderHome(){let h='';['Troubleshooting','Daily Operations','Reference'].forEach(g=>{h+=`<h2>${g==='Troubleshooting'?'🚨':g==='Daily Operations'?'⚙️':'📖'} ${g}</h2><div class="grid">`;articles.filter(a=>a.category===g).forEach(a=>h+=card(a));h+='</div>'});h+='<h2>🆘 Still have a problem?</h2><div class="card"><span>If the standard procedure does not solve the problem, contact VisionNav Service and provide the AGV ID, alarm message, RCS Task ID, location and screenshots.</span></div>';document.getElementById('homeContent').innerHTML=h}
function card(a){return `<div class="card issue" onclick="openById('${a.id}')"><div><span class="dot" style="background:${a.category==='Troubleshooting'?'var(--red)':'var(--blue)'}"></span><b>${a.icon} ${a.title}</b></div><span>${a.description}</span></div>`}
async function openById(id){const a=articles.find(x=>x.id===id);if(!a)return;location.hash=id;document.getElementById('home').style.display='none';document.getElementById('reader').style.display='block';document.getElementById('doc').innerHTML='<p>Loading...</p>';scrollTo(0,0);const t=await (await fetch(base+a.path)).text();document.getElementById('doc').innerHTML='<div class="meta">'+a.category+' · '+a.description+'</div>'+md(t)}
function goHome(){history.pushState({},'',base);document.getElementById('home').style.display='block';document.getElementById('reader').style.display='none';scrollTo(0,0)}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}
function md(s){let x=esc(s);x=x.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+x+'</p>'}
function search(){let q=document.getElementById('q').value.trim().toLowerCase(),box=document.getElementById('results');if(!q){box.innerHTML='';return}let hits=articles.filter(a=>(a.title+' '+a.description+' '+a.tags.join(' ')).toLowerCase().includes(q));box.innerHTML=hits.length?'<h2>Search results</h2><div class="grid">'+hits.map(card).join('')+'</div>':'<div class="no-results">No matching article found. Try another keyword.</div>'}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});init();
</script></body></html>
